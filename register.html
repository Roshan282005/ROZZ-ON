<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | ℝ𝕀ℤℤ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="src/app.js"></script>
    <!-- Font Awesome (Fixed with proper CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body aria-required="true"
    class="flex items-center justify-center min-h-screen bg-gradient-to-r from-purple-700 to-indigo-700">

    <!-- Container -->
    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Welcome to ℝ𝕀ℤℤ Auth</h2>

        <!-- LOGIN FORM -->
        <form id="loginForm" class="space-y-4">
            <div class="relative">
                <i class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="email" id="loginEmail" placeholder="Email" required
                    class="w-full pl-10 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
            </div>

            <div class="relative">
                <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="password" id="loginPassword" placeholder="Password" required
                    class="w-full pl-10 pr-10 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
                <i class="fas fa-eye absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 cursor-pointer"
                    id="toggleLoginPassword"></i>
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">Login</button>

            <!-- Google Login Button -->
            <button id="googleLoginBtn" type="button"
                class="w-full mt-4 bg-white border border-gray-300 rounded-lg py-2 flex items-center justify-center hover:bg-gray-100 transition">
                <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google Logo"
                    class="w-6 h-6 mr-2" />
                <span class="text-gray-700 font-medium">Sign in with Google</span>
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-4">Don’t have an account?
            <a href="#" onclick="toggleForm()" class="text-indigo-600 font-semibold">Register</a>
        </p>

        <!-- REGISTER FORM (Hidden Initially) -->
        <form id="registerForm" class="space-y-4 hidden mt-6">
            <div class="relative">
                <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="fName" placeholder="First Name" required
                    class="w-full pl-10 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
            </div>

            <div class="relative">
                <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="lName" placeholder="Last Name" required
                    class="w-full pl-10 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
            </div>

            <div class="relative">
                <i class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="email" id="registerEmail" placeholder="Email" required
                    class="w-full pl-10 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
            </div>

            <div class="relative">
                <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="password" id="registerPassword" placeholder="Password" required
                    class="w-full pl-10 pr-10 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
                <i class="fas fa-eye absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 cursor-pointer"
                    id="toggleRegisterPassword"></i>
            </div>

            <button type="submit"
                class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">Register</button>

            <p class="text-center text-sm text-gray-600 mt-4">Already have an account?
                <a href="#" onclick="toggleForm()" class="text-indigo-600 font-semibold">Login</a>
            </p>
        </form>
    </div>

    <!-- Firebase -->
    <script type="module">
        // Change API_URL to local backend for testing
        const API_URL = "http://localhost/rizz"; // Updated to local backend URL

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoIAiSnBx8GGNhjQkEB7j1bANx7k2l8dc",
            authDomain: "rizzauthapp.firebaseapp.com",
            databaseURL: "https://rizzauthapp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rizzauthapp",
            storageBucket: "rizzauthapp.firebasestorage.app",
            messagingSenderId: "607508317395",
            appId: "1:607508317395:web:f2f403d10915d6d2ef4026",
            measurementId: "G-2YQFBWK95F"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Toggle forms
        window.toggleForm = function () {
            document.getElementById("loginForm").classList.toggle("hidden");
            document.getElementById("registerForm").classList.toggle("hidden");
        };

        // Toggle password visibility
        function setupPasswordToggle(toggleId, inputId) {
            const toggle = document.getElementById(toggleId);
            const input = document.getElementById(inputId);
            toggle.addEventListener("click", () => {
                input.type = input.type === "password" ? "text" : "password";
                toggle.classList.toggle("fa-eye-slash");
            });
        }
        setupPasswordToggle("toggleLoginPassword", "loginPassword");
        setupPasswordToggle("toggleRegisterPassword", "registerPassword");

        // Register
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const fName = document.getElementById("fName").value;
            const lName = document.getElementById("lName").value;
            const email = document.getElementById("registerEmail").value;
            const password = document.getElementById("registerPassword").value;

            try {
                const result = await createUserWithEmailAndPassword(auth, email, password);
                const user = result.user;

                await fetch(`${API_URL}/login/signup.php`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        uid: user.uid,
                        email,
                        first_name: fName,
                        last_name: lName,
                        password: password
                    })
                });

                alert("Signup successful!");
                window.location.href = "index.html";
            } catch (err) {
                alert("Signup error: " + err.message);
            }
        });

        // Login
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            try {
                const result = await signInWithEmailAndPassword(auth, email, password);
                const user = result.user;

                const userData = {
                    uid: user.uid,
                    email: user.email,
                    name: user.displayName || "Manual User"
                };

                const response = await fetch(`${API_URL}/login/track-login.php`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    alert("Welcome back!");
                    window.location.href = "index.html";
                } else {
                    throw new Error("Failed to save user data");
                }
            } catch (err) {
                alert("Login failed: " + err.message);
                console.error("Login error:", err);
            }
        });

        // Google Login
        document.getElementById("googleLoginBtn").addEventListener("click", async () => {
            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                const userData = {
                    uid: user.uid,
                    email: user.email,
                    name: user.displayName || "Google User"
                };

                const response = await fetch(`${API_URL}/login/track-login.php`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    alert("Welcome, " + user.displayName);
                    window.location.href = "index.html";
                } else {
                    throw new Error("Failed to save user data");
                }
            } catch (err) {
                alert("Google login failed: " + err.message);
                console.error("Google login error:", err);
            }
        });
    </script>
</body>

</html>
